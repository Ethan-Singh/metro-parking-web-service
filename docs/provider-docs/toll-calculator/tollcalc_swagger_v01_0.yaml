    MatchApiResponse:
        properties:
            match:
                $ref: '#/definitions/TollCalculationResponse'
        type: object
    Route:
        properties:
            departureTime:
                format: date-time
                type: string
            destination:
                $ref: '#/definitions/CoordinatesLocationName'
            excludeToll:
                default: false
                type: boolean
            includeSteps:
                default: false
                type: boolean
            origin:
                $ref: '#/definitions/CoordinatesLocationName'
            vehicleClass:
                $ref: '#/definitions/VehicleClass'
            vehicleClassByMotorway:
                $ref: '#/definitions/VehicleClassByMotorway'
        required:
        - origin
        - destination
        type: object
    RouteApiResponse:
        properties:
            routes:
                items:
                    $ref: '#/definitions/TollCalculationResponse'
                type: array
        type: object
    TollCalculationResponse:
        properties:
            confidence:
                type: number
            distance:
                type: number
            duration:
                type: number
            geometry:
                type: string
            isCheapest:
                type: boolean
            isQuickest:
                type: boolean
            isShortest:
                type: boolean
            maxChargeInCents:
                type: number
            minChargeInCents:
                type: number
            summary:
                type: string
            tollsCharged:
                items:
                    $ref: '#/definitions/TollResponse'
                type: array
        type: object
    TollResponse:
        properties:
            chargeType:
                enum:
                - Fixed
                - TimeOfDay
                - Distance
                type: string
            charges:
                items:
                    properties:
                        chargeInCents:
                            type: number
                        vehicleClass:
                            $ref: '#/definitions/VehicleClass'
                    type: object
                type: array
            maxChargeInCents:
                type: number
            minChargeInCents:
                type: number
        type: object
    VehicleClass:
        enum:
        - A
        - B
        type: string
    VehicleClassByMotorway:
        properties:
            CCT:
                $ref: '#/definitions/VehicleClass'
            ED:
                $ref: '#/definitions/VehicleClass'
            LCT:
                $ref: '#/definitions/VehicleClass'
            M2:
                $ref: '#/definitions/VehicleClass'
            M4:
                $ref: '#/definitions/VehicleClass'
            M5:
                $ref: '#/definitions/VehicleClass'
            M7:
                $ref: '#/definitions/VehicleClass'
            SHB:
                $ref: '#/definitions/VehicleClass'
            SHT:
                $ref: '#/definitions/VehicleClass'
        type: object
host: api.transport.nsw.gov.au
info:
    title: Toll Calculator
    version: '2.0'
paths:
    /toll_calc/data:
        get:
            consumes:
            - application/json
            operationId: getData
            produces:
            - application/json
            responses:
                '200':
                    description: successful operation
                '201':
                    description: Created
                '400':
                    description: Bad Request
                '401':
                    description: Unauthorized
                '403':
                    description: Forbidden
                '404':
                    description: Not Found
            summary: Get information about toll road pricing in NSW
            tags:
            - pricing
    /toll_calc/match:
        post:
            consumes:
            - application/json
            operationId: getMatch
            parameters:
            -   description: Request object representing the journey
                in: body
                name: body
                required: true
                schema:
                    $ref: '#/definitions/Match'
            produces:
            - application/json
            responses:
                '200':
                    description: successful operation
                    schema:
                        $ref: '#/definitions/MatchApiResponse'
                '201':
                    description: Created
                '400':
                    description: Bad Request
                '401':
                    description: Unauthorized
                '403':
                    description: Forbidden
                '404':
                    description: Not Found
            summary: Returns the toll cost breakdown for the supplied route
            tags:
            - pricing
    /toll_calc/route:
        post:
            consumes:
            - application/json
            operationId: getRoutes
            parameters:
            -   description: Request object representing the journey
                in: body
                name: body
                required: true
                schema:
                    $ref: '#/definitions/Route'
            produces:
            - application/json
            responses:
                '200':
                    description: successful operation
                    schema:
                        $ref: '#/definitions/RouteApiResponse'
                '201':
                    description: Created
                '400':
                    description: Bad Request
                '401':
                    description: Unauthorized
                '403':
                    description: Forbidden
                '404':
                    description: Not Found
            summary: Returns possible routes between an origin and destination and
                the toll cost breakdown for the routes
            tags:
            - pricing
produces:
- application/json
schemes:
- https
security:
-   APIKey: []
securityDefinitions:
    APIKey:
        description: 'Expected Format: apikey [TOKEN]'
        in: header
        name: Authorization
        type: apiKey
swagger: '2.0'
tags:
-   description: the pricing API
    name: pricing-api-controller
