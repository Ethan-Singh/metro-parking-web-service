---
spring:
  application:
    name: metro-parking-web-service
  mongodb:
    uri: "${MONGODB_URI:mongodb://localhost:27017/metro-parking-database}"
  data:
    mongodb:
      auto-index-creation: true
logging:
  level:
    root: INFO
    com.example.metro_parking_web_service: INFO
    sun.rmi: INFO
    javax.management: INFO
management:
  endpoints:
    web:
      base-path: "${ACTUATOR_BASE_PATH:/actuator}"
      exposure:
        include: "health, readiness, startup"
springdoc:
  api-docs:
    enabled: "${API_DOCS:false}"
    path: /v3/api-docs
  swagger-ui:
    enabled: "${SWAGGER_UI:false}"
    path: /swagger-ui.html
    display-request-duration: true
  show-actuator: false
server:
  port: 8080
  compression:
    enabled: true
    mime-types:
    - application/json
    min-response-size: 1024
providers:
  tfnsw:
    base-url: "${TFNSW_BASE_URL:}"
    apikey: "${TFNSW_APIKEY:}"
    parking:
      api: "${PARKING_API:}"
      policy:
        disabled-facilities:
        - 1
        - 2
        - 3
        - 4
        - 5
        backfill-window: 31
      analytics:
        almost-full-threshold: 0.1
      security:
        allowed-origins: "${ALLOWED_ORIGINS:[http://localhost:5173]}"
        rate-limit:
          capacity: 60
          refill-tokens: 60
          refill-period-seconds: 60
    timetable:
      api:
        sydney-trains: "${TIMETABLE_SYDNEY_TRAINS_API:}"
        metro: "${TIMETABLE_METRO_API:}"
      enabled: "${TIMETABLE_PROVIDER_ENABLED:true}"
      refresh-interval: "${TIMETABLE_REFRESH_INTERVAL:PT6H}"
    realtime:
      api:
        alerts-sydney-trains: "${TFNSW_REALTIME_ALERTS_SYDNEY_TRAINS_API:/v2/gtfs/alerts/sydneytrains}"
        alerts-metro: "${TFNSW_REALTIME_ALERTS_METRO_API:/v2/gtfs/alerts/metro}"
        trip-updates-sydney-trains: "${TFNSW_REALTIME_TRIP_UPDATES_SYDNEY_TRAINS_API:/v2/gtfs/realtime/sydneytrains}"
        trip-updates-metro: "${TFNSW_REALTIME_TRIP_UPDATES_METRO_API:/v2/gtfs/realtime/metro}"
        vehicle-positions-sydney-trains: "${TFNSW_REALTIME_VEHICLE_POSITIONS_SYDNEY_TRAINS_API:/v2/gtfs/vehiclepos/sydneytrains}"
        vehicle-positions-metro: "${TFNSW_REALTIME_VEHICLE_POSITIONS_METRO_API:/v2/gtfs/vehiclepos/metro}"
      enabled: "${TFNSW_REALTIME_ENABLED:true}"
      refresh-interval: "${TFNSW_REALTIME_REFRESH_INTERVAL:PT1M}"
timetable:
  snapshot:
    bootstrap-enabled: false
    sydney-trains-zip: docs/apis/v1-gtfs/schedules/sydneytrains/sydneytrains_GTFS_PROD_20261027140100.zip
    metro-zip: docs/apis/v2-gtfs/schedules/metro/metro_GTFS_PROD_20261026124700.zip
    maximum-compressed-package-bytes: 2097152
resilience4j:
  circuitbreaker:
    instances:
      parkingClient:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 80
        register-health-indicator: true
  retry:
    instances:
      parkingClient:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
        retry-exceptions:
        - org.springframework.web.client.ResourceAccessException
        - java.io.IOException
