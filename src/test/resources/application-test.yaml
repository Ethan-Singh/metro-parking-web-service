---
spring:
  application:
    name: metro-parking-web-service
  mongodb:
    uri: mongodb://localhost:27017/metro-parking-test
  data:
    mongodb:
      auto-index-creation: true
providers:
  tfnsw:
    base-url: ""
    apikey: ""
    parking:
      api: /parking
      policy:
        disabled-facilities:
        - 1
        - 2
        backfill-window: 31
      security:
        allowed-origins:
        - http://localhost:3000
        rate-limit:
          capacity: 25
          refill-tokens: 10
          refill-period-seconds: 60
    timetable:
      api:
        sydney-trains: /v1/gtfs/schedule/sydneytrains
        metro: /v2/gtfs/schedule/metro
      enabled: false
      refresh-interval: PT6H
    realtime:
      api:
        alerts-sydney-trains: /v2/gtfs/alerts/sydneytrains
        alerts-metro: /v2/gtfs/alerts/metro
        trip-updates-sydney-trains: /v2/gtfs/realtime/sydneytrains
        trip-updates-metro: /v2/gtfs/realtime/metro
        vehicle-positions-sydney-trains: /v2/gtfs/vehiclepos/sydneytrains
        vehicle-positions-metro: /v2/gtfs/vehiclepos/metro
      enabled: false
      refresh-interval: PT1M
